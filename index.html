<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema SST — DB Agronegócios</title>
<link rel="icon" href="img/logo-db.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="sst-app">

<div id="raiz"><div class="carregando"><div><div class="giro"></div>Carregando…</div></div></div>

<!-- ===================== TELA DE ACESSO ===================== -->
<template id="tpl-acesso">
  <div class="login-tela">
    <aside class="login-lado">
      <img src="img/logo-db.png" alt="DB Agronegócios">
      <div>
        <h2>Investigação de acidentes e análise de causas</h2>
        <p>Registre a NIAT e a análise dos 5 Porquês num só lugar, com numeração por unidade, histórico e acesso controlado.</p>
        <div class="faixa">
          <span style="background:#B71247"></span><span style="background:#E07B00"></span><span style="background:#2e7d32"></span><span style="background:#C9A227"></span>
        </div>
      </div>
      <div class="rodape">DB Agronegócios · Segurança do Trabalho · Softsafe Consultoria</div>
    </aside>
    <main class="login-form-lado">
      <div class="login-box" id="caixa"></div>
    </main>
  </div>
</template>

<template id="tpl-entrar">
  <h1>Entrar</h1>
  <p class="sub">Use o e-mail e a senha do seu cadastro.</p>
  <div id="msg"></div>
  <form id="f">
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn primario bloco" type="submit">Entrar</button>
  </form>
  <div class="links"><a data-ir="cadastro">Criar cadastro</a><a data-ir="esqueci">Esqueci a senha</a></div>
</template>

<template id="tpl-cadastro">
  <h1>Criar cadastro</h1>
  <p class="sub">Depois do cadastro, o Administrador precisa liberar o seu acesso.</p>
  <div id="msg"></div>
  <form id="f">
    <div class="campo"><label for="nome">Nome completo</label><input id="nome" type="text" autocomplete="name" required></div>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="senha">Senha (mínimo 6 caracteres)</label><input id="senha" type="password" minlength="6" autocomplete="new-password" required></div>
    <div class="campo"><label for="senha2">Repita a senha</label><input id="senha2" type="password" minlength="6" autocomplete="new-password" required></div>
    <button class="btn primario bloco" type="submit">Cadastrar</button>
  </form>
  <div class="links"><a data-ir="entrar">← Já tenho cadastro</a></div>
</template>

<template id="tpl-esqueci">
  <h1>Recuperar senha</h1>
  <p class="sub">Vamos enviar um link para você criar uma senha nova.</p>
  <div id="msg"></div>
  <form id="f">
    <div class="campo"><label for="email">E-mail do cadastro</label><input id="email" type="email" autocomplete="email" required></div>
    <button class="btn primario bloco" type="submit">Enviar link</button>
  </form>
  <div class="links"><a data-ir="entrar">← Voltar</a></div>
</template>

<template id="tpl-novasenha">
  <h1>Nova senha</h1>
  <p class="sub">Escolha a sua nova senha de acesso.</p>
  <div id="msg"></div>
  <form id="f">
    <div class="campo"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="6" autocomplete="new-password" required></div>
    <div class="campo"><label for="senha2">Repita a nova senha</label><input id="senha2" type="password" minlength="6" autocomplete="new-password" required></div>
    <button class="btn primario bloco" type="submit">Salvar senha</button>
  </form>
</template>

<template id="tpl-espera">
  <div class="espera">
    <div class="icone" id="esp-ic">⏳</div>
    <h1 id="esp-tit">Cadastro aguardando aprovação</h1>
    <p class="sub" id="esp-txt">Seu cadastro foi recebido. Assim que o Administrador liberar o acesso, você já consegue entrar.</p>
    <button class="btn primario bloco" id="b-verificar" type="button">Verificar de novo</button>
    <div class="links" style="justify-content:center"><a id="b-sair">Sair</a></div>
  </div>
</template>

<!-- ===================== MENU INICIAL ===================== -->
<template id="tpl-menu">
  <header id="sst-appbar"></header>
  <main class="sst-main">
    <div class="saudacao">
      <h1 id="ola"></h1>
      <p>O que você vai registrar hoje?</p>
    </div>

    <div class="opcoes">
      <a class="sst-card opcao niat" href="niat.html">
        <div class="ic">📝</div>
        <div>
          <div class="cod">FOR 005-001</div>
          <h3>Investigação de Acidente (NIAT)</h3>
          <p>Notificação de incidentes e acidentes: o que aconteceu, envolvidos, Diagrama de Ishikawa (6 Ms), causas e plano de ação.</p>
        </div>
        <span class="seta">Criar →</span>
      </a>
      <a class="sst-card opcao pq" href="cincoporques.html">
        <div class="ic">❓</div>
        <div>
          <div class="cod">FOR 005-002</div>
          <h3>Análise dos 5 Porquês</h3>
          <p>Aprofundamento das causas para acidentes graves ou de alto potencial, ligado ao número da NIAT.</p>
        </div>
        <span class="seta">Criar →</span>
      </a>
    </div>

    <div class="secao-rotulo">Acompanhamento</div>
    <div class="numeros" id="numeros"></div>

    <div class="secao-rotulo">Atalhos</div>
    <div class="atalhos" id="atalhos">
      <a class="sst-card atalho" href="relatorios.html"><span class="ic">📂</span><div><b>Lista de relatórios</b><span>Pesquisar, abrir e imprimir</span></div></a>
      <a class="sst-card atalho" href="relatorios.html?situacao=rascunho"><span class="ic">✏️</span><div><b>Rascunhos</b><span>Relatórios ainda não concluídos</span></div></a>
    </div>

    <div class="secao-rotulo">Últimos relatórios</div>
    <div class="sst-card tabela-wrap" id="recentes"></div>
  </main>
</template>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const { sb, esc, toast, traduzErro } = SST;
const raiz = document.getElementById('raiz');
let modoRecuperacao = /type=recovery/.test(location.hash);

// ── Tela de acesso ───────────────────────────────────────────────
function mostrarAcesso(tela, aviso) {
  if (!document.getElementById('caixa')) raiz.innerHTML = document.getElementById('tpl-acesso').innerHTML;
  const caixa = document.getElementById('caixa');
  caixa.innerHTML = document.getElementById('tpl-' + tela).innerHTML;
  caixa.querySelectorAll('[data-ir]').forEach(a => a.onclick = () => mostrarAcesso(a.dataset.ir));
  if (aviso) msg(aviso.texto, aviso.tipo);
  const f = caixa.querySelector('#f');
  if (f) f.onsubmit = e => { e.preventDefault(); acoes[tela](f); };
  const primeiro = caixa.querySelector('input'); if (primeiro) primeiro.focus();
}
function msg(texto, tipo = 'erro') {
  const m = document.getElementById('msg');
  if (m) m.innerHTML = texto ? `<div class="alerta ${tipo}">${esc(texto)}</div>` : '';
}
async function ocupado(f, fn) {
  const b = f.querySelector('button[type=submit]'); const t = b.textContent;
  b.disabled = true; b.textContent = 'Aguarde…';
  try { await fn(); } catch (e) { msg(traduzErro(e)); } finally { b.disabled = false; b.textContent = t; }
}
const v = id => document.getElementById(id).value.trim();

const acoes = {
  entrar: f => ocupado(f, async () => {
    const { error } = await sb.auth.signInWithPassword({ email: v('email'), password: document.getElementById('senha').value });
    if (error) throw error;
    await iniciar();
  }),
  cadastro: f => ocupado(f, async () => {
    const s1 = document.getElementById('senha').value, s2 = document.getElementById('senha2').value;
    if (s1 !== s2) return msg('As senhas não são iguais.');
    if (v('nome').split(/\s+/).length < 2) return msg('Informe nome e sobrenome.');
    const { data, error } = await sb.auth.signUp({
      email: v('email'), password: s1,
      options: { data: { nome: v('nome') }, emailRedirectTo: location.origin + location.pathname }
    });
    if (error) throw error;
    if (data.session) return iniciar();
    mostrarAcesso('entrar', { tipo: 'ok', texto: 'Cadastro feito! Confirme o e-mail pelo link que enviamos. Depois, aguarde o Administrador liberar o acesso.' });
  }),
  esqueci: f => ocupado(f, async () => {
    const { error } = await sb.auth.resetPasswordForEmail(v('email'), { redirectTo: location.origin + location.pathname });
    if (error) throw error;
    msg('Se o e-mail estiver cadastrado, o link chega em alguns minutos. Confira também a caixa de spam.', 'ok');
  }),
  novasenha: f => ocupado(f, async () => {
    const s1 = document.getElementById('senha').value, s2 = document.getElementById('senha2').value;
    if (s1 !== s2) return msg('As senhas não são iguais.');
    const { error } = await sb.auth.updateUser({ password: s1 });
    if (error) throw error;
    modoRecuperacao = false;
    history.replaceState(null, '', location.pathname);
    toast('Senha alterada.', 'ok');
    await iniciar();
  })
};

function mostrarEspera(perfil) {
  mostrarAcesso('espera');
  if (perfil.situacao === 'bloqueado') {
    document.getElementById('esp-ic').textContent = '🔒';
    document.getElementById('esp-tit').textContent = 'Acesso bloqueado';
    document.getElementById('esp-txt').textContent = 'Seu acesso está bloqueado. Fale com o Administrador do sistema.';
  }
  document.getElementById('b-verificar').onclick = iniciar;
  document.getElementById('b-sair').onclick = SST.sair;
}

// ── Menu inicial ─────────────────────────────────────────────────
async function mostrarMenu(perfil) {
  raiz.innerHTML = document.getElementById('tpl-menu').innerHTML;
  document.getElementById('ola').textContent = `Olá, ${SST.primeiroNome(perfil.nome) || 'bem-vindo(a)'}!`;
  await SST.barra(perfil, 'inicio');

  if (perfil.papel === 'admin') {
    document.getElementById('atalhos').insertAdjacentHTML('beforeend',
      `<a class="sst-card atalho" href="usuarios.html"><span class="ic">👥</span><div><b>Usuários</b><span id="pend-txt">Aprovar e gerenciar acessos</span></div></a>
       <a class="sst-card atalho" href="configuracoes.html"><span class="ic">⚙️</span><div><b>Lista do Ishikawa</b><span>Editar grupos e itens de causas</span></div></a>`);
    const { count } = await sb.from('perfis').select('id', { count: 'exact', head: true }).eq('situacao', 'pendente');
    if (count) document.getElementById('pend-txt').innerHTML = `<b style="color:#8a6510;display:inline">${count} aguardando aprovação</b>`;
  }

  const { data, error } = await sb.from('lista_relatorios')
    .select('id,tipo,numero,unidade_nome,classificacao,data_ocorrencia,envolvido,situacao,atualizado_em,autor,ano')
    .order('atualizado_em', { ascending: false }).limit(1000);
  if (error) { toast(traduzErro(error), 'erro'); return; }

  const ano = new Date().getFullYear();
  const doAno = data.filter(r => r.ano === ano);
  const n = (f) => doAno.filter(f).length;
  document.getElementById('numeros').innerHTML = [
    [n(r => r.tipo === 'niat'), `NIATs em ${ano}`],
    [n(r => r.tipo === '5pq'), `5 Porquês em ${ano}`],
    [n(r => r.classificacao === 'grave'), `Acidentes graves em ${ano}`],
    [data.filter(r => r.situacao === 'rascunho').length, 'Rascunhos em aberto']
  ].map(([val, rot]) => `<div class="sst-card numero-card"><div class="v">${val}</div><div class="r">${esc(rot)}</div></div>`).join('');

  const rec = data.slice(0, 6);
  const box = document.getElementById('recentes');
  if (!rec.length) {
    box.innerHTML = `<div class="vazio"><div class="ic">🗂️</div>Nenhum relatório ainda. Comece criando uma NIAT.</div>`;
    return;
  }
  box.innerHTML = `<table class="tabela"><thead><tr><th>Nº</th><th>Tipo</th><th>Unidade</th><th>Envolvido</th><th>Classificação</th><th>Situação</th><th>Atualizado</th></tr></thead><tbody>
    ${rec.map(r => `<tr data-id="${r.id}" data-tipo="${r.tipo}">
      <td class="num">${esc(r.numero)}</td>
      <td><span class="etiqueta ${r.tipo === 'niat' ? 'niat' : 'pq'}">${SST.TIPOS[r.tipo].curto}</span></td>
      <td>${esc(r.unidade_nome)}</td>
      <td>${esc(r.envolvido) || '<span class="sub">—</span>'}</td>
      <td>${r.classificacao ? `<span class="etiqueta ${r.classificacao}">${SST.CLASSIF[r.classificacao].curto}</span>` : '—'}</td>
      <td><span class="etiqueta ${r.situacao}">${r.situacao === 'concluido' ? 'Concluído' : 'Rascunho'}</span></td>
      <td>${SST.dataHoraBR(r.atualizado_em)}</td></tr>`).join('')}
    </tbody></table>`;
  box.querySelectorAll('tr[data-id]').forEach(tr =>
    tr.onclick = () => location.href = `${SST.TIPOS[tr.dataset.tipo].pagina}?id=${tr.dataset.id}`);
}

// ── Retorno dos links de e-mail (confirmação / troca de senha) ───
function avisoDoLink() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const q = new URLSearchParams(location.search);
  const codigo = h.get('error_code') || q.get('error_code');
  if (!codigo && !h.get('error') && !q.get('error')) return null;
  history.replaceState(null, '', location.pathname);
  if (codigo === 'otp_expired')
    return { tipo: 'info', texto: 'Este link já foi usado ou venceu. Se você já confirmou o e-mail, é só entrar com seu e-mail e senha.' };
  return { tipo: 'erro', texto: 'Não foi possível validar o link do e-mail. Tente entrar com seu e-mail e senha.' };
}
const emailConfirmado = /type=(signup|email)/.test(location.hash);
const avisoInicial = avisoDoLink();

// ── Início ───────────────────────────────────────────────────────
async function iniciar() {
  if (avisoInicial && !(await SST.sessao())) return mostrarAcesso('entrar', avisoInicial);
  const s = await SST.sessao();
  if (modoRecuperacao && s) return mostrarAcesso('novasenha');
  if (!s) return mostrarAcesso('entrar');
  let perfil;
  try { perfil = await SST.perfilAtual(); } catch (e) { return mostrarAcesso('entrar', { texto: traduzErro(e) }); }
  if (!perfil) return mostrarAcesso('entrar', { texto: 'Perfil não encontrado. Fale com o Administrador.' });
  if (perfil.situacao !== 'ativo') return mostrarEspera(perfil);
  return mostrarMenu(perfil);
}

if (emailConfirmado) setTimeout(() => toast('E-mail confirmado.', 'ok'), 600);
sb.auth.onAuthStateChange(evento => {
  if (evento === 'PASSWORD_RECOVERY') { modoRecuperacao = true; mostrarAcesso('novasenha'); }
});
iniciar();
</script>
</body>
</html>
